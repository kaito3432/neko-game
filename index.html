<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ネコ vs 柴犬警察</title>
<style>
:root{
  --ivory:#FDFBF7;--brown:#5D4037;--brown2:#8D6E63;--pink:#F8C8DC;--pink2:#FDEAF1;
  --blue:#BFE3F2;--blue2:#E8F6FB;--blue3:#DDF3FF;--yellow:#FFF0B8;--track:#FFF9C4;
  --green:#DDEFCF;--danger:#E66A6A;--danger2:#FFE4E4;--orange:#F3A75B;
  --road:#DED7D0;--box:#E8BC79;--box2:#F8DDAE;--box3:#B47D42;--disabled:#D9D6D2;
  --dog-red:#F6A6A0;--dog-blue:#9ED9F3;--dog-cream:#F4DDA4;--shadow:rgba(93,64,55,.16)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ivory)}
body{
  margin:0;min-height:100dvh;color:var(--brown);
  background:
    radial-gradient(circle at 8% 3%,#FFF3CF 0,transparent 26%),
    radial-gradient(circle at 93% 12%,#FDE7F0 0,transparent 25%),
    radial-gradient(circle at 75% 96%,#E7F5FB 0,transparent 30%),var(--ivory);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  overscroll-behavior:none
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{width:min(100%,540px);margin:auto;padding:max(8px,env(safe-area-inset-top)) 8px max(18px,env(safe-area-inset-bottom))}
.hero{text-align:center;margin-bottom:6px}.hero h1{margin:0;font-size:clamp(19px,5.6vw,29px)}.hero p{margin:3px 0 0;font-size:10px;font-weight:800;color:var(--brown2)}
.status-row{display:grid;grid-template-columns:74px 1fr;gap:6px;margin-bottom:6px}
.card,.guide{border:2px solid var(--brown);border-radius:13px;box-shadow:0 3px 0 var(--shadow)}
.card{min-height:50px;padding:6px 8px}.turn{background:var(--yellow)}.phase{background:var(--pink2)}.guide{margin-bottom:6px;padding:7px 9px;background:var(--blue2)}
.label{font-size:8px;font-weight:900;opacity:.55}.main{margin-top:1px;font-size:12px;line-height:1.25;font-weight:900}.turn-extra{display:block;margin-top:1px;font-size:8px;font-weight:900}
.turn.t9{background:#FFE49B}.turn.t10{background:#FFD7A5;border-color:var(--orange)}.turn.t11{background:var(--danger2);border-color:var(--danger);animation:lastPulse 1s infinite}.turn.t11 .main{color:var(--danger)}
@keyframes lastPulse{50%{transform:scale(1.035)}}
.board-shell{padding:7px;border:3px solid var(--brown);border-radius:20px;background:#FFFEFA;box-shadow:0 6px 0 var(--shadow)}
.board-title{text-align:center;font-size:12px;font-weight:900;margin-bottom:5px}
.board{
  --road:clamp(16px,4.8vw,23px);--boxs:calc((100% - var(--road)*6)/5);
  position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:13px;
  background:
    repeating-linear-gradient(to right,var(--road) 0,var(--road) var(--road),transparent var(--road),transparent calc(var(--road) + var(--boxs))),
    repeating-linear-gradient(to bottom,var(--road) 0,var(--road) var(--road),transparent var(--road),transparent calc(var(--road) + var(--boxs))),
    #F3EEE9
}
.box{
  position:absolute;padding:0;border:2px solid var(--box3);border-radius:10px;
  background:linear-gradient(145deg,var(--box2),var(--box));overflow:hidden;z-index:4;
  transition:transform .13s,background .18s,outline .18s
}
.box:active{transform:scale(.95)}
.boxnum{position:absolute;top:2px;left:4px;z-index:15;font-size:7px;font-weight:900;opacity:.5}
.boxemoji{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(15px,5.7vw,28px);opacity:.4;pointer-events:none}
.cat{position:absolute;inset:0;z-index:18;display:grid;place-items:center;font-size:clamp(20px,6.5vw,33px);pointer-events:none}
.cat-current{outline:4px dashed #E77FA6;outline-offset:-3px}
.cat-valid{outline:4px solid rgba(91,169,100,.8);outline-offset:-3px;background:linear-gradient(145deg,#F0F9EA,#DFF1D5)}
.cat-visited{background:linear-gradient(145deg,#E5E2DF,var(--disabled))!important;border-color:#BEB8B2}
.cat-visited .boxemoji{opacity:.22}
.cat-danger{outline:4px solid rgba(230,106,106,.8);outline-offset:-3px;background:linear-gradient(145deg,#FFF1F1,#FFDADA)}
.danger-mark{position:absolute;right:3px;top:3px;z-index:18;width:20px;height:20px;display:grid;place-items:center;border-radius:999px;background:#fff;border:1.5px solid var(--danger);font-size:12px;pointer-events:none}
.private-foot{position:absolute;right:4px;bottom:4px;z-index:17;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:1px 3px;border-radius:999px;border:1.5px solid var(--brown);background:rgba(255,255,255,.9);font-size:13px;font-weight:900;pointer-events:none}
.private-start{background:#FFF0EE;border-color:#D7564D}
.searchable{background:linear-gradient(145deg,#F0FAFF,var(--blue3));outline:4px solid rgba(70,164,216,.82);outline-offset:-3px;animation:searchPulse .9s infinite}
@keyframes searchPulse{50%{transform:scale(.96)}}
.revealed{background:linear-gradient(145deg,#FFFDE3,var(--track))!important;border-color:#C79D3E}
.track-badge{position:absolute;inset:7px 4px 4px;z-index:17;display:flex;justify-content:center;align-items:center;border:2px solid var(--brown);border-radius:9px;background:rgba(255,255,255,.93);pointer-events:none}
.track-icon{font-size:clamp(20px,6vw,30px)}
.node{position:absolute;width:clamp(27px,7.8vw,38px);height:clamp(27px,7.8vw,38px);padding:0;transform:translate(-50%,-50%);z-index:26;border:2px solid var(--brown);border-radius:999px;background:#fff;box-shadow:0 2px 0 rgba(93,64,55,.16)}
.node:active:not(:disabled){transform:translate(-50%,-50%) scale(.9)}
.node.inactive{width:clamp(12px,3.5vw,17px);height:clamp(12px,3.5vw,17px);border:1.5px solid #BFB8B1;background:#D4CFCA;opacity:.45;box-shadow:none;pointer-events:none}
.node.setup{background:#FFF0B8}.node.selected{outline:3px solid rgba(232,126,165,.5);background:var(--pink)}.node.move{background:var(--green);border-color:#6C9B59;animation:nodePulse .9s infinite}
@keyframes nodePulse{50%{transform:translate(-50%,-50%) scale(1.13)}}
.dogstack{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;z-index:28;pointer-events:none}
.dogtoken{min-width:23px;height:23px;padding:0 2px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--brown);border-radius:999px;font-size:10px;font-weight:900}
.dog-red{background:var(--dog-red)}.dog-blue{background:var(--dog-blue)}.dog-cream{background:var(--dog-cream)}
.dog-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.dog-card{min-height:52px;padding:5px 3px;border:2px solid var(--brown);border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--shadow);text-align:center;font-size:9px;line-height:1.25;font-weight:900}
.dog-card.red{background:#FFF0EF}.dog-card.blue{background:#EEF9FF}.dog-card.cream{background:#FFF8E8}.dog-card.selected{outline:3px solid rgba(232,126,165,.5);transform:translateY(-2px)}.dog-card.done{opacity:.64}.dog-name{display:block;font-size:11px;margin-bottom:2px}
.message{min-height:45px;margin-top:7px;padding:7px 9px;border:2px solid var(--brown);border-radius:13px;background:rgba(255,255,255,.91);font-size:11px;line-height:1.45;font-weight:800}
.controls{position:sticky;bottom:0;z-index:70;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding:6px 0 max(4px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--ivory) 74%,transparent)}
.btn{min-height:47px;padding:7px 6px;border:2px solid var(--brown);border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--shadow);font-size:11px;font-weight:900}.btn:disabled{opacity:.34}.pink{background:var(--pink)}.yellow{background:var(--yellow)}.wide{grid-column:1/-1}
.toast{position:fixed;left:50%;top:45%;width:min(87vw,350px);padding:17px 14px;z-index:3000;border:3px solid var(--brown);border-radius:23px;background:#FFFDF9;box-shadow:0 10px 0 rgba(93,64,55,.2);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.83);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast-icon{font-size:46px}.toast-title{margin-top:6px;font-size:18px;font-weight:900}.toast-text{margin-top:4px;font-size:12px;font-weight:800}
.shake{animation:shake .55s ease}@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.overlay{position:fixed;inset:0;z-index:2100;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(93,64,55,.46);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.overlay.show{display:flex}
.modal{width:min(94vw,430px);padding:20px;border:3px solid var(--brown);border-radius:23px;background:var(--ivory);box-shadow:0 9px 0 rgba(93,64,55,.18);text-align:center}.modal-icon{font-size:52px}.modal h2{margin:6px 0 8px;font-size:22px}.modal p{margin:0 0 13px;font-size:13px;line-height:1.55;font-weight:800}

/* ===== Ver1.5.1 演出強化 ===== */
.btn{transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:active:not(:disabled){transform:translateY(2px) scale(.98);box-shadow:0 1px 0 var(--shadow);filter:brightness(.98)}
.box{transform-origin:center;will-change:transform}
.box.tap-pop{animation:tapPop .22s ease}
@keyframes tapPop{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}

.box.opening{animation:boxOpen .42s ease}
@keyframes boxOpen{
  0%{transform:translateY(0) scale(1)}
  35%{transform:translateY(-4px) scale(1.04) rotate(-1deg)}
  65%{transform:translateY(-2px) scale(.98) rotate(1deg)}
  100%{transform:translateY(0) scale(1)}
}
.box.opening::after{
  content:"✨";
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(24px,8vw,42px);z-index:30;pointer-events:none;
  animation:sparkBurst .42s ease forwards
}
@keyframes sparkBurst{
  0%{opacity:0;transform:scale(.5)}
  45%{opacity:1;transform:scale(1.12)}
  100%{opacity:0;transform:scale(1.5)}
}

.cat-fly{
  position:fixed;z-index:3500;pointer-events:none;
  font-size:42px;line-height:1;transform:translate(-50%,-50%);
  transition:left .36s cubic-bezier(.2,.8,.2,1),top .36s cubic-bezier(.2,.8,.2,1),transform .36s ease,opacity .36s ease;
  filter:drop-shadow(0 4px 4px rgba(93,64,55,.18))
}
.cat-fly.go{transform:translate(-50%,-50%) scale(.88) rotate(8deg)}
.cat-fly::after{
  content:"💨";position:absolute;right:85%;top:36%;font-size:24px
}

.dog-sniff{
  position:fixed;z-index:3400;pointer-events:none;
  transform:translate(-50%,-50%);font-size:38px;
  animation:sniffWiggle .55s ease-in-out 2
}
.dog-sniff::after{
  content:"👃";position:absolute;right:-18px;top:13px;font-size:21px;
  animation:nosePulse .28s ease-in-out infinite alternate
}
.dog-sniff::before{
  content:"💨";position:absolute;right:-38px;top:4px;font-size:19px;
  animation:breathFloat .6s ease-in-out infinite
}
@keyframes sniffWiggle{
  0%,100%{transform:translate(-50%,-50%) rotate(0)}
  25%{transform:translate(-50%,-50%) rotate(-7deg)}
  75%{transform:translate(-50%,-50%) rotate(7deg)}
}
@keyframes nosePulse{from{transform:scale(.8)}to{transform:scale(1.18)}}
@keyframes breathFloat{0%{opacity:0;transform:translateX(0)}50%{opacity:1}100%{opacity:0;transform:translateX(10px)}}

.fx-burst{
  position:fixed;z-index:3600;pointer-events:none;transform:translate(-50%,-50%);
  font-size:36px;animation:fxBurst .7s ease forwards
}
@keyframes fxBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1.5)}
}

.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:3900;overflow:hidden}
.confetti-piece{
  position:absolute;top:-24px;font-size:20px;
  animation:confettiFall var(--dur) linear forwards;
}
@keyframes confettiFall{
  to{transform:translate(var(--drift),110vh) rotate(720deg);opacity:.95}
}

.resultOverlayCelebration .modal{animation:resultBounce .5s cubic-bezier(.2,.9,.25,1.2)}
@keyframes resultBounce{
  0%{transform:scale(.72);opacity:.2}
  65%{transform:scale(1.07);opacity:1}
  100%{transform:scale(1)}
}

.motion-status{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:3300;pointer-events:none;
  padding:7px 12px;border:2px solid var(--brown);border-radius:999px;
  background:rgba(255,253,249,.95);font-size:11px;font-weight:900;
  box-shadow:0 4px 0 var(--shadow);opacity:0;transition:.15s
}
.motion-status.show{opacity:1}

</style>
</head>

<body>
<div class="app">
  <header class="hero">
    <h1>🐱 ネコ vs 柴犬警察 🐕</h1>
    <p>ダンボール街で、11ターン逃げ切れ！</p>
  </header>

  <section class="status-row">
    <div class="card turn" id="turnCard">
      <div class="label">TURN</div>
      <div class="main" id="turnDisplay">1 / 11</div>
      <span class="turn-extra" id="turnExtra"></span>
    </div>
    <div class="card phase">
      <div class="label">PHASE</div>
      <div class="main" id="phaseDisplay">🐱 ネコ初期配置</div>
    </div>
  </section>

  <section class="guide">
    <div class="label">操作ガイド</div>
    <div class="main" id="guideDisplay">ネコのスタート箱を1つ選ぼう</div>
  </section>

  <section class="board-shell">
    <div class="board-title">🏠 ダンボール街</div>
    <div class="board" id="board"></div>
  </section>

  <section class="dog-row">
    <button class="dog-card red" id="dogCard0"><span class="dog-name">🟥 あか柴</span>未配置</button>
    <button class="dog-card blue" id="dogCard1"><span class="dog-name">🟦 あお柴</span>未配置</button>
    <button class="dog-card cream" id="dogCard2"><span class="dog-name">🟨 しろ柴</span>未配置</button>
  </section>

  <div class="message" id="message">🐱 ネコのスタート地点を秘密に決めよう。</div>

  <section class="controls">
    <button class="btn pink" id="catViewBtn">👀 ネコ位置を見る</button>
    <button class="btn yellow" id="finishDogTurnBtn">✅ 柴犬ターン終了</button>
    <button class="btn wide" id="restartBtn">🔄 最初から</button>
  </section>
</div>

<div class="overlay" id="privacyOverlay">
  <div class="modal">
    <div class="modal-icon" id="privacyIcon">🐕</div>
    <h2 id="privacyTitle">交代</h2>
    <p id="privacyText"></p>
    <button class="btn pink" id="privacyBtn">OK</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="modal-icon" id="resultIcon">🎉</div>
    <h2 id="resultTitle">ゲーム終了</h2>
    <p id="resultText"></p>
    <button class="btn pink" id="againBtn">🔄 もう一度遊ぶ</button>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-icon" id="toastIcon">🐾</div>
  <div class="toast-title" id="toastTitle">痕跡発見！</div>
  <div class="toast-text" id="toastText"></div>
</div>

<div class="motion-status" id="motionStatus"></div>
<div class="confetti-layer" id="confettiLayer"></div>

<script>
const BR=5,BC=5,NR=6,NC=6,BOX_COUNT=25,NODE_COUNT=36,MAX_TURNS=11;
const DOGS=[
  {name:"あか柴",label:"🟥",token:"dog-red"},
  {name:"あお柴",label:"🟦",token:"dog-blue"},
  {name:"しろ柴",label:"🟨",token:"dog-cream"}
];

let game,toastTimer;
const $=id=>document.getElementById(id);
const board=$("board"),turnCard=$("turnCard"),turnDisplay=$("turnDisplay"),turnExtra=$("turnExtra"),phaseDisplay=$("phaseDisplay"),guideDisplay=$("guideDisplay");
const dogCards=[$("dogCard0"),$("dogCard1"),$("dogCard2")],message=$("message");
const catViewBtn=$("catViewBtn"),finishDogTurnBtn=$("finishDogTurnBtn"),restartBtn=$("restartBtn");
const privacyOverlay=$("privacyOverlay"),privacyIcon=$("privacyIcon"),privacyTitle=$("privacyTitle"),privacyText=$("privacyText"),privacyBtn=$("privacyBtn");
const resultOverlay=$("resultOverlay"),resultIcon=$("resultIcon"),resultTitle=$("resultTitle"),resultText=$("resultText"),againBtn=$("againBtn");
const toast=$("toast"),toastIcon=$("toastIcon"),toastTitle=$("toastTitle"),toastText=$("toastText");

const motionStatus=$("motionStatus"),confettiLayer=$("confettiLayer");

function haptic(pattern){
  try{
    if(navigator.vibrate) navigator.vibrate(pattern);
  }catch(e){}
}
function showMotionStatus(text,ms=700){
  motionStatus.textContent=text;
  motionStatus.classList.add("show");
  setTimeout(()=>motionStatus.classList.remove("show"),ms);
}
function centerOfBox(i){
  const el=board.querySelector(`[data-box-index="${i}"]`);
  if(!el)return null;
  const r=el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,el};
}
function centerOfNode(i){
  const nodes=[...board.querySelectorAll(".node")];
  const el=nodes[i];
  if(!el)return null;
  const r=el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,el};
}
function tapPopBox(i){
  const p=centerOfBox(i);
  if(!p)return;
  p.el.classList.remove("tap-pop");
  void p.el.offsetWidth;
  p.el.classList.add("tap-pop");
  setTimeout(()=>p.el.classList.remove("tap-pop"),260);
}
function animateBoxOpen(i){
  const p=centerOfBox(i);
  if(!p)return;
  p.el.classList.remove("opening");
  void p.el.offsetWidth;
  p.el.classList.add("opening");
  setTimeout(()=>p.el.classList.remove("opening"),470);
}
function burstAtBox(i,emoji="✨"){
  const p=centerOfBox(i);
  if(!p)return;
  const e=document.createElement("div");
  e.className="fx-burst";e.textContent=emoji;
  e.style.left=p.x+"px";e.style.top=p.y+"px";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),760);
}
function animateCatMove(from,to,done){
  const a=centerOfBox(from),b=centerOfBox(to);
  if(!a||!b){done&&done();return}
  const e=document.createElement("div");
  e.className="cat-fly";e.textContent="🐱";
  e.style.left=a.x+"px";e.style.top=a.y+"px";
  document.body.appendChild(e);
  requestAnimationFrame(()=>{
    e.classList.add("go");
    e.style.left=b.x+"px";e.style.top=b.y+"px";
  });
  setTimeout(()=>{
    burstAtBox(to,"💨");
    e.style.opacity="0";
    setTimeout(()=>{e.remove();done&&done()},120);
  },380);
}
function animateSniff(di,bi,done){
  const n=centerOfNode(game.dogs[di]);
  if(!n){done&&done();return}
  const e=document.createElement("div");
  e.className="dog-sniff";
  e.textContent=`🐕${di+1}`;
  e.style.left=n.x+"px";e.style.top=n.y+"px";
  document.body.appendChild(e);
  showMotionStatus("クンクン……",750);
  haptic(18);
  setTimeout(()=>{
    animateBoxOpen(bi);
  },320);
  setTimeout(()=>{
    e.remove();
    done&&done();
  },820);
}
function confetti(){
  confettiLayer.innerHTML="";
  const pieces=["🎉","✨","🌟","🎊","💖","🐾"];
  for(let i=0;i<34;i++){
    const e=document.createElement("span");
    e.className="confetti-piece";
    e.textContent=pieces[Math.floor(Math.random()*pieces.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.setProperty("--dur",(1.8+Math.random()*1.7)+"s");
    e.style.setProperty("--drift",(-80+Math.random()*160)+"px");
    e.style.animationDelay=(Math.random()*.45)+"s";
    confettiLayer.appendChild(e);
  }
  setTimeout(()=>confettiLayer.innerHTML="",3600);
}


function bindPress(el,fn){if(!el)return;el.addEventListener("click",e=>{if(!el.disabled)fn(e)})}

function initGame(){
  game={
    turn:1,phase:"catSetup",catPos:null,catVisible:false,
    catHistory:new Map(),revealedTracks:new Set(),
    dogs:[null,null,null],dogSetupCount:0,selectedDog:null,
    dogAction:[false,false,false],gameOver:false
  };
  privacyOverlay.classList.remove("show");
  resultOverlay.classList.remove("show");
  hideToast();
  setMessage("🐱 ネコのスタート地点を秘密に決めよう。好きな箱を1つタップしてください。");
  render();
}

const boxRow=i=>Math.floor(i/BC),boxCol=i=>i%BC,nodeRow=i=>Math.floor(i/NC),nodeCol=i=>i%NC;

function isActiveDogNode(i){
  const r=nodeRow(i),c=nodeCol(i);
  return r>=1&&r<=4&&c>=1&&c<=4;
}

function getBoxNeighbors(i){
  const r=boxRow(i),c=boxCol(i),a=[];
  if(r>0)a.push(i-BC);if(r<BR-1)a.push(i+BC);if(c>0)a.push(i-1);if(c<BC-1)a.push(i+1);
  return a;
}
function getCatLegalMoves(){
  if(game.catPos===null)return[];
  return getBoxNeighbors(game.catPos).filter(i=>!game.catHistory.has(i));
}
function isCatDeadEnd(target){
  if(!getCatLegalMoves().includes(target))return false;
  return getBoxNeighbors(target).filter(n=>n!==game.catPos&&!game.catHistory.has(n)).length===0;
}

function getNodeNeighbors(i){
  const r=nodeRow(i),c=nodeCol(i),a=[];
  if(r>0)a.push(i-NC);if(r<NR-1)a.push(i+NC);if(c>0)a.push(i-1);if(c<NC-1)a.push(i+1);
  return a;
}
function getDogLegalMoves(di){
  const cur=game.dogs[di];if(cur===null)return[];
  return getNodeNeighbors(cur).filter(isActiveDogNode).filter(t=>!game.dogs.some((p,j)=>j!==di&&p===t));
}
function getBoxesAroundNode(i){
  const r=nodeRow(i),c=nodeCol(i),out=[];
  [[r-1,c-1],[r-1,c],[r,c-1],[r,c]].forEach(([br,bc])=>{
    if(br>=0&&br<BR&&bc>=0&&bc<BC)out.push(br*BC+bc);
  });
  return out;
}

function render(){renderBoard();renderStatus();renderDogCards();renderControls()}

function renderBoard(){
  board.innerHTML="";

  for(let i=0;i<BOX_COUNT;i++){
    const r=boxRow(i),c=boxCol(i),b=document.createElement("button");
    b.type="button";b.className="box";b.dataset.boxIndex=String(i);
    b.style.left=`calc(var(--road) + ${c} * (var(--road) + var(--boxs)))`;
    b.style.top=`calc(var(--road) + ${r} * (var(--road) + var(--boxs)))`;
    b.style.width="var(--boxs)";b.style.height="var(--boxs)";

    if(game.phase==="cat"&&game.catVisible){
      if(game.catHistory.has(i)&&i!==game.catPos)b.classList.add("cat-visited");
      if(i===game.catPos)b.classList.add("cat-current");
      if(getCatLegalMoves().includes(i)){
        b.classList.add("cat-valid");
        if(isCatDeadEnd(i))b.classList.add("cat-danger");
      }
    }

    if(game.phase==="dogs"&&game.selectedDog!==null&&!game.dogAction[game.selectedDog]){
      if(getBoxesAroundNode(game.dogs[game.selectedDog]).includes(i))b.classList.add("searchable");
    }

    if(game.phase!=="cat"&&game.revealedTracks.has(i)){
      b.classList.add("revealed");
    }

    b.innerHTML=`<span class="boxnum">${i+1}</span><span class="boxemoji">📦</span>
      ${game.phase==="cat"&&game.catVisible&&game.catPos===i?'<span class="cat">🐱</span>':""}
      ${privateHistoryHTML(i)}
      ${publicTrackHTML(i)}
      ${game.phase==="cat"&&game.catVisible&&isCatDeadEnd(i)?'<span class="danger-mark">⚠️</span>':""}`;

    bindPress(b,()=>handleBoxPress(i));
    board.appendChild(b);
  }

  for(let i=0;i<NODE_COUNT;i++){
    const r=nodeRow(i),c=nodeCol(i),n=document.createElement("button");
    n.type="button";n.className="node";
    n.style.left=`calc(${c} * (var(--road) + var(--boxs)) + var(--road)/2)`;
    n.style.top=`calc(${r} * (var(--road) + var(--boxs)) + var(--road)/2)`;

    if(!isActiveDogNode(i)){n.classList.add("inactive");n.disabled=true}
    if(game.phase==="dogSetup"&&isActiveDogNode(i))n.classList.add("setup");
    if(game.selectedDog!==null&&game.dogs[game.selectedDog]===i)n.classList.add("selected");
    if(game.phase==="dogs"&&game.selectedDog!==null&&!game.dogAction[game.selectedDog]&&getDogLegalMoves(game.selectedDog).includes(i))n.classList.add("move");

    const here=game.dogs.map((p,j)=>p===i?j:-1).filter(j=>j>=0);
    if(here.length){
      const s=document.createElement("span");s.className="dogstack";
      here.forEach(j=>{
        const t=document.createElement("span");t.className=`dogtoken ${DOGS[j].token}`;t.textContent=`🐕${j+1}`;s.appendChild(t);
      });
      n.appendChild(s);
    }

    if(!n.disabled)bindPress(n,()=>handleNodePress(i));
    board.appendChild(n);
  }
}

function privateHistoryHTML(i){
  if(game.phase!=="cat"||!game.catVisible||!game.catHistory.has(i))return"";
  return '<span class="private-foot">🐾</span>';
}

function publicTrackHTML(i){
  if(game.phase==="cat"||!game.revealedTracks.has(i))return"";
  return '<span class="track-badge"><span class="track-icon">🐾</span></span>';
}

function handleBoxPress(i){
  if(game.gameOver)return;
  tapPopBox(i);

  if(game.phase==="catSetup"){
    game.catPos=i;game.catHistory.set(i,0);game.catVisible=false;game.phase="dogSetup";
    showPrivacy("🐕","柴犬警察へ交代","ネコのスタート地点は秘密になりました。中央の16交差点から柴犬3匹のスタート位置を順番に選んでください。");
    setMessage("🐕 中央16交差点から柴犬3匹を配置してください。");
    render();return;
  }

  if(game.phase==="cat"){
    if(!game.catVisible){setMessage("まず「👀 ネコ位置を見る」をタップしてください。");return}
    if(!getCatLegalMoves().includes(i)){setMessage("グレーの箱には戻れません。緑の箱から1つ選んでください。");return}

    const dead=isCatDeadEnd(i);
    const from=game.catPos;
    haptic(10);
    animateCatMove(from,i,()=>{
      game.catPos=i;game.catHistory.set(i,game.turn);game.catVisible=false;

      if(dead||getCatLegalMoves().length===0){
        endGame("dogs","ネコが行き止まりに入り、次の逃げ道がなくなりました！");
        return;
      }

      game.phase="dogs";game.selectedDog=null;game.dogAction=[false,false,false];
      showPrivacy("🐕","柴犬警察の番","ネコの移動が完了しました。現在地と未発見の足跡は隠れています。");
      setMessage("🐕 柴犬を選択すると、緑の交差点へ移動・青い箱を探索できます。");
      render();
    });
    return;
  }

  if(game.phase==="dogs"&&game.selectedDog!==null&&!game.dogAction[game.selectedDog]){
    const di=game.selectedDog;
    if(!getBoxesAroundNode(game.dogs[di]).includes(i)){setMessage("青く光っている箱から1つ選んでください。");return}
    performSearch(di,i);
  }
}

function handleNodePress(i){
  if(game.gameOver||!isActiveDogNode(i))return;

  if(game.phase==="dogSetup"){
    if(game.dogs.includes(i)){setMessage("その交差点にはすでに柴犬がいます。");return}
    const di=game.dogSetupCount;
    game.dogs[di]=i;game.dogSetupCount++;

    if(game.dogSetupCount>=3){
      game.phase="cat";
      showPrivacy("🐱","ターン1・ネコの番","柴犬3匹の配置が完了しました。ネコさんだけ画面を見てください。");
      setMessage("🐱 「ネコ位置を見る」を押して、自分の足跡と移動先を確認してください。");
    }else{
      setMessage(`${DOGS[di].label} ${DOGS[di].name} を配置しました。次の柴犬を選んでください。`);
    }

    render();return;
  }

  if(game.phase!=="dogs")return;

  const tapped=game.dogs.findIndex(p=>p===i);
  if(tapped!==-1){selectDog(tapped);return}

  if(game.selectedDog!==null&&!game.dogAction[game.selectedDog]){
    const di=game.selectedDog;

    if(!getDogLegalMoves(di).includes(i)){
      setMessage("緑色に光っている交差点へ1マス移動できます。");
      return;
    }

    game.dogs[di]=i;
    game.dogAction[di]="move";
    game.selectedDog=null;

    setMessage(`${DOGS[di].label} ${DOGS[di].name} は移動済み✓。`);
    afterDogAction();
    render();
  }
}

function selectDog(di){
  if(game.phase!=="dogs"||game.gameOver||game.dogs[di]===null)return;

  if(game.dogAction[di]){
    setMessage(`${DOGS[di].label} ${DOGS[di].name} はこのターン行動済みです。`);
    return;
  }

  if(game.selectedDog===di){
    game.selectedDog=null;
    setMessage("柴犬の選択を解除しました。");
    render();
    return;
  }

  game.selectedDog=di;
  setMessage(`${DOGS[di].label} ${DOGS[di].name} を選択。緑の交差点＝移動、青い箱＝探索です。`);
  render();
}

function performSearch(di,bi){
  animateSniff(di,bi,()=>{
    if(bi===game.catPos){
      haptic([35,45,70]);
      burstAtBox(bi,"🐱✨");
      shakeBoxSoon(bi);
      endGame("dogs",`${DOGS[di].name} が箱${bi+1}をクンクン……ネコを発見！`);
      return;
    }

    if(game.catHistory.has(bi)){
      game.revealedTracks.add(bi);
      haptic([15,35,25]);
      burstAtBox(bi,"🐾✨");
      shakeBoxSoon(bi);
      showToast("🐕🐾","クンクン……！","ネコの足跡を発見！");
    }else{
      haptic(10);
      burstAtBox(bi,"💨");
      showToast("💨","クンクン……","何もないワン！");
    }

    game.dogAction[di]="search";
    game.selectedDog=null;

    setMessage(`${DOGS[di].label} ${DOGS[di].name} は探索済み✓。`);
    afterDogAction();
    render();
  });
}

function afterDogAction(){
  if(!game.dogAction.every(a=>a!==false))return;

  game.phase="waitingEnd";
  setMessage("✅ 3匹の行動が完了しました。「柴犬ターン終了」を押してください。");
}

function toggleCatView(){
  if(game.phase!=="cat"||game.gameOver)return;

  game.catVisible=!game.catVisible;

  setMessage(
    game.catVisible
      ?"🐱 自分の足跡を表示中。グレー＝通過済み、緑＝移動可、赤⚠️＝行き止まり。"
      :"🙈 ネコの位置と足跡を隠しました。"
  );

  render();
}

function finishDogTurn(){
  if(game.phase!=="waitingEnd"||game.gameOver)return;

  if(game.turn>=MAX_TURNS){
    endGame("cat","11ターンすべて逃げ切りました！");
    return;
  }

  game.turn++;

  if(getCatLegalMoves().length===0){
    endGame("dogs","ネコが次に移動できる箱がありません！");
    return;
  }

  game.phase="cat";
  game.catVisible=false;
  game.selectedDog=null;
  game.dogAction=[false,false,false];

  let extra=game.turn===9?" あと3ターン！":game.turn===10?" あと2ターン！":game.turn===11?" LAST TURN！":"";

  showPrivacy("🐱",`ターン${game.turn}・ネコの番`,`柴犬警察から画面を受け取ってください。ネコさんだけ足跡と現在地を確認します。${extra}`);
  setMessage(`🐱 ターン${game.turn}。まだ通っていない隣の箱へ移動しよう。${extra}`);

  render();
}

function renderStatus(){
  turnDisplay.textContent=`${game.turn} / ${MAX_TURNS}`;
  turnCard.className="card turn";
  turnExtra.textContent="";

  if(game.turn===9&&!game.gameOver){turnCard.classList.add("t9");turnExtra.textContent="あと3ターン！"}
  if(game.turn===10&&!game.gameOver){turnCard.classList.add("t10");turnExtra.textContent="あと2ターン！"}
  if(game.turn===11&&!game.gameOver){turnCard.classList.add("t11");turnExtra.textContent="LAST TURN"}

  const p={
    catSetup:"🐱 ネコ初期配置",
    dogSetup:"🐕 柴犬初期配置",
    cat:"🐱 ネコ移動",
    dogs:"🐕 柴犬行動",
    waitingEnd:"🌙 行動完了",
    gameover:"🎉 ゲーム終了"
  };

  phaseDisplay.textContent=p[game.phase]||"";

  if(game.phase==="catSetup")guideDisplay.textContent="ネコのスタート箱を1つタップ";
  else if(game.phase==="dogSetup")guideDisplay.textContent=`中央16交差点から柴犬を配置 ${game.dogSetupCount}/3`;
  else if(game.phase==="cat")guideDisplay.textContent=game.catVisible?"緑の箱へ移動。グレーには戻れません":"「ネコ位置を見る」をタップ";
  else if(game.phase==="dogs")guideDisplay.textContent=game.selectedDog===null?"盤面または下のカードから柴犬を選択":"緑の交差点＝移動 / 青い箱＝探索";
  else if(game.phase==="waitingEnd")guideDisplay.textContent="柴犬ターン終了をタップ";
  else guideDisplay.textContent="ゲーム終了";
}

function renderDogCards(){
  for(let i=0;i<3;i++){
    const c=dogCards[i];
    c.classList.remove("selected","done");

    const pos=game.dogs[i];
    let status="未配置";

    if(pos!==null){
      if(game.dogAction[i]==="move"){status="移動済み ✓";c.classList.add("done")}
      else if(game.dogAction[i]==="search"){status="探索済み ✓";c.classList.add("done")}
      else status="行動できます";
    }

    c.innerHTML=`<span class="dog-name">${DOGS[i].label} ${DOGS[i].name}</span>${status}`;

    if(game.selectedDog===i)c.classList.add("selected");

    c.disabled=!(game.phase==="dogs"&&pos!==null&&!game.dogAction[i]);
  }
}

function renderControls(){
  catViewBtn.disabled=game.phase!=="cat"||game.gameOver;
  catViewBtn.textContent=game.catVisible?"🙈 ネコ位置を隠す":"👀 ネコ位置を見る";
  finishDogTurnBtn.disabled=game.phase!=="waitingEnd"||game.gameOver;
}

function setMessage(t){message.textContent=t}
function showPrivacy(icon,title,text){privacyIcon.textContent=icon;privacyTitle.textContent=title;privacyText.textContent=text;privacyOverlay.classList.add("show")}
function closePrivacy(){privacyOverlay.classList.remove("show")}
function showToast(icon,title,text){clearTimeout(toastTimer);toastIcon.textContent=icon;toastTitle.textContent=title;toastText.textContent=text;toast.classList.add("show");toastTimer=setTimeout(hideToast,1500)}
function hideToast(){toast.classList.remove("show")}
function shakeBoxSoon(i){setTimeout(()=>{const e=board.querySelector(`[data-box-index="${i}"]`);if(!e)return;e.classList.add("shake");setTimeout(()=>e.classList.remove("shake"),600)},35)}

function endGame(winner,reason){
  game.gameOver=true;
  game.phase="gameover";
  game.catVisible=true;
  game.selectedDog=null;

  if(winner==="dogs"){
    resultIcon.textContent="🐕🐕🐕✨";
    resultTitle.textContent="柴犬警察の勝利！";
    resultText.textContent=`${reason} ネコの最後の場所は箱${game.catPos+1}でした。`;
  }else{
    resultIcon.textContent="🐱🎀✨";
    resultTitle.textContent="いたずらネコの勝利！";
    resultText.textContent=`${reason} 最後は箱${game.catPos+1}に隠れていました。`;
  }

  resultOverlay.classList.add("show");
  resultOverlay.classList.add("resultOverlayCelebration");
  haptic([40,50,40,50,90]);
  confetti();
  setTimeout(()=>resultOverlay.classList.remove("resultOverlayCelebration"),700);
  render();
}

for(let i=0;i<3;i++)bindPress(dogCards[i],()=>selectDog(i));
bindPress(catViewBtn,toggleCatView);
bindPress(finishDogTurnBtn,finishDogTurn);
bindPress(restartBtn,initGame);
bindPress(privacyBtn,closePrivacy);
bindPress(againBtn,initGame);

initGame();
</script>
</body>
</html>
