<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いたずらネコ vs 柴犬警察</title>
<style>
:root{
  --ivory:#FDFBF7;--brown:#5D4037;--brown2:#80645B;--pink:#F8C8DC;--pink2:#FDEAF1;
  --blue:#BFE3F2;--blue2:#E8F6FB;--blue3:#DDF3FF;--yellow:#FFF0B8;--track:#FFF9C4;
  --green:#DDEFCF;--red:#D95C5C;--red2:#FFE4E4;--road:#DED7D0;
  --box:#E8BC79;--box2:#F8DDAE;--box3:#B47D42;--shadow:rgba(93,64,55,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ivory)}
body{
  margin:0;min-height:100dvh;color:var(--brown);
  background:
    radial-gradient(circle at 10% 5%,#FFF3CF 0,transparent 26%),
    radial-gradient(circle at 92% 13%,#FDE7F0 0,transparent 26%),
    radial-gradient(circle at 75% 96%,#E7F5FB 0,transparent 30%),
    var(--ivory);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{width:min(100%,520px);margin:auto;padding:max(10px,env(safe-area-inset-top)) 9px max(24px,env(safe-area-inset-bottom))}
.hero{text-align:center;margin-bottom:9px}
.hero h1{margin:0;font-size:clamp(21px,6vw,31px)}
.hero p{margin:4px 0 0;font-size:11px;font-weight:800;color:var(--brown2)}
.status{display:grid;grid-template-columns:90px 1fr;gap:7px;margin-bottom:8px}
.card{border:2px solid var(--brown);border-radius:15px;padding:7px 9px;box-shadow:0 4px 0 var(--shadow)}
.turn{background:var(--yellow)} .turn.danger{background:var(--red2);border-color:var(--red);animation:pulse 1.2s infinite}
.phase{background:var(--pink2)} .guide{grid-column:1/-1;background:var(--blue2)}
.label{font-size:9px;font-weight:900;opacity:.58}.value{margin-top:2px;font-size:13px;line-height:1.35;font-weight:900}
@keyframes pulse{50%{transform:scale(1.035)}}
.board-shell{padding:9px;border:3px solid var(--brown);border-radius:22px;background:#FFFEFA;box-shadow:0 7px 0 var(--shadow)}
.board-title{text-align:center;margin-bottom:7px;font-size:13px;font-weight:900}
.board{
  --road:clamp(17px,5vw,24px);--box:calc((100% - var(--road)*6)/5);
  position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
  background:
    repeating-linear-gradient(to right,var(--road) 0,var(--road) var(--road),transparent var(--road),transparent calc(var(--road) + var(--box))),
    repeating-linear-gradient(to bottom,var(--road) 0,var(--road) var(--road),transparent var(--road),transparent calc(var(--road) + var(--box))),
    #F3EEE9;
}
.box{
  position:absolute;padding:0;border:2px solid var(--box3);border-radius:11px;
  background:linear-gradient(145deg,var(--box2),var(--box));overflow:hidden;z-index:4;
}
.box:active{transform:scale(.95)}
.boxnum{position:absolute;top:2px;left:4px;font-size:8px;font-weight:900;opacity:.52;z-index:12}
.boxemoji{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(16px,6vw,29px);opacity:.42;pointer-events:none}
.cat{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(21px,7vw,34px);z-index:15;pointer-events:none}
.cat-current{outline:4px dashed #E77FA6;outline-offset:-3px}
.cat-valid{outline:4px solid rgba(91,169,100,.72);outline-offset:-3px}
.searchable{background:linear-gradient(145deg,#F0FAFF,var(--blue3));outline:4px solid rgba(70,164,216,.8);outline-offset:-3px}
.track-box{background:linear-gradient(145deg,#FFFDE2,var(--track))!important;border-color:#C79D3E}
.track-badge{
  position:absolute;inset:7px 4px 4px;z-index:14;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px solid var(--brown);border-radius:9px;background:rgba(255,255,255,.93);font-weight:900;pointer-events:none
}
.track-main{font-size:clamp(19px,6vw,29px);line-height:1}.track-label{font-size:clamp(7px,2.2vw,10px);font-weight:900}
.start-track .track-badge{background:#FFF0EE;border-color:#CB5247}.start-label{background:#D7564D;color:white;padding:2px 4px;border-radius:5px;font-size:9px}
.big-six{position:absolute;right:2px;top:0;min-width:22px;height:22px;display:grid;place-items:center;border-radius:999px;background:var(--brown);color:white;font-size:14px}
.node{
  position:absolute;width:clamp(28px,8vw,39px);height:clamp(28px,8vw,39px);padding:0;
  transform:translate(-50%,-50%);z-index:25;border:2px solid var(--brown);border-radius:999px;background:white;
}
.node:active{transform:translate(-50%,-50%) scale(.9)}
.node.setup{background:#FFF2BC}.node.selected{background:var(--pink);outline:3px solid rgba(232,126,165,.45)}
.node.move{background:var(--green)}
.dogstack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dogtoken{min-width:22px;height:22px;padding:0 2px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--brown);border-radius:999px;background:var(--blue);font-size:10px;font-weight:900}
.dog-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.dog-card{min-height:48px;padding:6px 3px;border:2px solid var(--brown);border-radius:13px;background:var(--blue2);text-align:center;font-size:10px;line-height:1.3;font-weight:900}
.dog-card.done{background:#EEEAE6;opacity:.72}.dog-card.selected{background:var(--pink2);outline:3px solid rgba(230,126,163,.43)}
.action{display:none;margin-top:8px;padding:9px;border:2px solid var(--brown);border-radius:15px;background:#FFF}
.action.show{display:block}.action-title{text-align:center;font-size:12px;font-weight:900;margin-bottom:7px}.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.message{min-height:48px;margin-top:8px;padding:8px 10px;border:2px solid var(--brown);border-radius:14px;background:rgba(255,255,255,.91);font-size:11px;line-height:1.48;font-weight:800}
.log{margin-top:8px;padding:8px 9px;border:2px dashed var(--brown2);border-radius:13px;background:rgba(255,255,255,.68)}
.log-title{font-size:10px;font-weight:900;margin-bottom:4px}.log-items{display:flex;gap:5px;overflow-x:auto}
.chip{flex:none;padding:4px 7px;border:1.5px solid var(--brown);border-radius:999px;background:#fff;font-size:9px;font-weight:900}
.controls{position:sticky;bottom:0;z-index:60;display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;padding:7px 0 max(5px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--ivory) 72%,transparent)}
.btn{min-height:49px;padding:8px 6px;border:2px solid var(--brown);border-radius:14px;background:white;box-shadow:0 3px 0 var(--shadow);font-size:12px;font-weight:900}
.btn:disabled{opacity:.36}.pink{background:var(--pink)}.blue{background:var(--blue)}.green{background:var(--green)}.yellow{background:var(--yellow)}.wide{grid-column:1/-1}
.toast{
  position:fixed;left:50%;top:46%;width:min(86vw,350px);padding:17px 14px;z-index:3000;border:3px solid var(--brown);border-radius:23px;background:#FFFDF9;
  box-shadow:0 10px 0 rgba(93,64,55,.2);text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.82);transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast-icon{font-size:47px}.toast-title{font-size:19px;font-weight:900;margin-top:7px}.toast-text{font-size:12px;font-weight:800;margin-top:5px}
.overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(93,64,55,.46)}
.overlay.show{display:flex}.modal{width:min(94vw,430px);padding:20px;border:3px solid var(--brown);border-radius:24px;background:var(--ivory);text-align:center}
.modal-icon{font-size:54px}.modal h2{margin:6px 0 8px;font-size:22px}.modal p{font-size:13px;line-height:1.55;font-weight:800}
.shake{animation:shake .55s ease}@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
</style>
</head>
<body>
<div class="app">
  <header class="hero"><h1>🐱 ネコ vs 柴犬警察 🐕</h1><p>ダンボール街でこっそり逃走中！</p></header>

  <section class="status">
    <div class="card turn" id="turnCard"><div class="label">TURN</div><div class="value" id="turnDisplay">1 / 15</div></div>
    <div class="card phase"><div class="label">PHASE</div><div class="value" id="phaseDisplay">🐱 ネコ初期配置</div></div>
    <div class="card guide"><div class="label">操作ガイド</div><div class="value" id="guideDisplay">ネコのスタート箱を1つ選ぼう</div></div>
  </section>

  <section class="board-shell">
    <div class="board-title">🏠 ダンボール街</div>
    <div class="board" id="board"></div>
  </section>

  <section class="dog-row">
    <div class="dog-card" id="dog0">🐕1<br>未配置</div>
    <div class="dog-card" id="dog1">🐕2<br>未配置</div>
    <div class="dog-card" id="dog2">🐕3<br>未配置</div>
  </section>

  <section class="action" id="actionPanel">
    <div class="action-title" id="actionTitle">🐕1 はどうする？</div>
    <div class="action-buttons">
      <button class="btn green" id="moveBtn">🐾 移動する</button>
      <button class="btn blue" id="searchBtn">👃 探索する</button>
    </div>
  </section>

  <div class="message" id="message">🐱 ネコのスタート地点を秘密に決めよう。</div>

  <section class="log">
    <div class="log-title">🔎 最近の発見</div>
    <div class="log-items" id="logItems"><span style="font-size:9px;opacity:.65">まだ痕跡はありません</span></div>
  </section>

  <section class="controls">
    <button class="btn pink" id="catViewBtn">👀 ネコ位置を見る</button>
    <button class="btn yellow" id="finishBtn">✅ 柴犬ターン終了</button>
    <button class="btn wide" id="restartBtn">🔄 最初から</button>
  </section>
</div>

<div class="overlay" id="privacyOverlay">
  <div class="modal">
    <div class="modal-icon" id="privacyIcon">🐕</div>
    <h2 id="privacyTitle">交代</h2>
    <p id="privacyText"></p>
    <button class="btn pink" id="privacyBtn">OK</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="modal-icon" id="resultIcon">🎉</div>
    <h2 id="resultTitle">ゲーム終了</h2>
    <p id="resultText"></p>
    <button class="btn pink" id="againBtn">🔄 もう一度遊ぶ</button>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-icon" id="toastIcon">🐾</div>
  <div class="toast-title" id="toastTitle">痕跡発見！</div>
  <div class="toast-text" id="toastText"></div>
</div>

<script>
const BR=5, BC=5, NR=6, NC=6, MAX=15;
let game, toastTimer;

const $=id=>document.getElementById(id);
const board=$("board"), turnCard=$("turnCard"), turnDisplay=$("turnDisplay"), phaseDisplay=$("phaseDisplay"), guideDisplay=$("guideDisplay");
const dogCards=[$("dog0"),$("dog1"),$("dog2")];
const actionPanel=$("actionPanel"), actionTitle=$("actionTitle"), moveBtn=$("moveBtn"), searchBtn=$("searchBtn");
const message=$("message"), logItems=$("logItems"), catViewBtn=$("catViewBtn"), finishBtn=$("finishBtn"), restartBtn=$("restartBtn");
const privacyOverlay=$("privacyOverlay"), privacyIcon=$("privacyIcon"), privacyTitle=$("privacyTitle"), privacyText=$("privacyText"), privacyBtn=$("privacyBtn");
const resultOverlay=$("resultOverlay"), resultIcon=$("resultIcon"), resultTitle=$("resultTitle"), resultText=$("resultText"), againBtn=$("againBtn");
const toast=$("toast"), toastIcon=$("toastIcon"), toastTitle=$("toastTitle"), toastText=$("toastText");

/* Safari / iPhone では通常の click が最も安定 */
function bindPress(el,fn){ el.addEventListener("click",e=>{ if(!el.disabled) fn(e); }); }

function init(){
  game={
    turn:1,phase:"catSetup",catPos:null,catVisible:false,
    catHistory:new Map(),revealed:new Map(),discoveries:[],
    dogs:[null,null,null],dogSetupCount:0,selectedDog:null,dogMode:null,
    dogAction:[false,false,false],gameOver:false
  };
  privacyOverlay.classList.remove("show");
  resultOverlay.classList.remove("show");
  toast.classList.remove("show");
  setMsg("🐱 ネコのスタート地点を秘密に決めよう。");
  render();
}

const boxRow=i=>Math.floor(i/BC), boxCol=i=>i%BC, nodeRow=i=>Math.floor(i/NC), nodeCol=i=>i%NC;

function boxNeighbors(i){
  const r=boxRow(i),c=boxCol(i),a=[];
  if(r>0)a.push(i-BC); if(r<BR-1)a.push(i+BC); if(c>0)a.push(i-1); if(c<BC-1)a.push(i+1);
  return a;
}
function catMoves(){ return game.catPos===null?[]:boxNeighbors(game.catPos).filter(i=>!game.catHistory.has(i)); }

function nodeNeighbors(i){
  const r=nodeRow(i),c=nodeCol(i),a=[];
  if(r>0)a.push(i-NC); if(r<NR-1)a.push(i+NC); if(c>0)a.push(i-1); if(c<NC-1)a.push(i+1);
  return a;
}
function dogMoves(di){
  const cur=game.dogs[di]; if(cur===null)return [];
  return nodeNeighbors(cur).filter(t=>!game.dogs.some((p,j)=>j!==di&&p===t));
}
function boxesAroundNode(i){
  const r=nodeRow(i),c=nodeCol(i),out=[];
  [[r-1,c-1],[r-1,c],[r,c-1],[r,c]].forEach(([br,bc])=>{
    if(br>=0&&br<BR&&bc>=0&&bc<BC)out.push(br*BC+bc);
  });
  return out;
}

function render(){ renderBoard(); renderStatus(); renderDogs(); renderAction(); renderLog(); renderControls(); }

function renderBoard(){
  board.innerHTML="";
  for(let i=0;i<25;i++){
    const r=boxRow(i),c=boxCol(i),b=document.createElement("button");
    b.className="box"; b.dataset.boxIndex=i;
    b.style.left=`calc(var(--road) + ${c} * (var(--road) + var(--box)))`;
    b.style.top=`calc(var(--road) + ${r} * (var(--road) + var(--box)))`;
    b.style.width="var(--box)"; b.style.height="var(--box)";
    if(game.catVisible&&game.catPos===i)b.classList.add("cat-current");
    if(game.phase==="cat"&&game.catVisible&&catMoves().includes(i))b.classList.add("cat-valid");
    if(game.phase==="dogs"&&game.selectedDog!==null&&game.dogMode==="search"&&boxesAroundNode(game.dogs[game.selectedDog]).includes(i))b.classList.add("searchable");
    if(game.revealed.has(i)){
      b.classList.add("track-box");
      if(game.revealed.get(i)===0)b.classList.add("start-track");
    }
    b.innerHTML=`<span class="boxnum">${i+1}</span><span class="boxemoji">📦</span>${game.catVisible&&game.catPos===i?'<span class="cat">🐱</span>':""}${trackHTML(i)}`;
    bindPress(b,()=>boxPress(i));
    board.appendChild(b);
  }

  for(let i=0;i<36;i++){
    const r=nodeRow(i),c=nodeCol(i),n=document.createElement("button");
    n.className="node";
    n.style.left=`calc(${c} * (var(--road) + var(--box)) + var(--road)/2)`;
    n.style.top=`calc(${r} * (var(--road) + var(--box)) + var(--road)/2)`;
    if(game.phase==="dogSetup")n.classList.add("setup");
    if(game.selectedDog!==null&&game.dogs[game.selectedDog]===i)n.classList.add("selected");
    if(game.phase==="dogs"&&game.selectedDog!==null&&game.dogMode==="move"&&dogMoves(game.selectedDog).includes(i))n.classList.add("move");
    const here=game.dogs.map((p,j)=>p===i?j:-1).filter(j=>j>=0);
    if(here.length){
      const s=document.createElement("span"); s.className="dogstack";
      here.forEach(j=>{const t=document.createElement("span");t.className="dogtoken";t.textContent=`🐕${j+1}`;s.appendChild(t);});
      n.appendChild(s);
    }
    bindPress(n,()=>nodePress(i));
    board.appendChild(n);
  }
}

function trackHTML(i){
  if(!game.revealed.has(i))return "";
  const t=game.revealed.get(i);
  if(t===0)return '<span class="track-badge"><span class="track-main">🚩</span><span class="start-label">START</span></span>';
  if(t===6)return '<span class="track-badge"><span class="track-main">🐾</span><span class="track-label">6ターン目</span><span class="big-six">6</span></span>';
  return '<span class="track-badge"><span class="track-main">🐾</span><span class="track-label">ネコの痕跡</span></span>';
}

function boxPress(i){
  if(game.gameOver)return;

  if(game.phase==="catSetup"){
    game.catPos=i; game.catHistory.set(i,0); game.phase="dogSetup";
    showPrivacy("🐕","柴犬警察へ交代","ネコのスタート地点は秘密になりました。36か所の交差点から柴犬3匹の開始位置を順番に選んでください。");
    setMsg("🐕 柴犬1〜3を好きな交差点へ配置しよう。"); render(); return;
  }

  if(game.phase==="cat"){
    if(!game.catVisible){setMsg("まず「👀 ネコ位置を見る」を押してください。");return;}
    if(!catMoves().includes(i)){setMsg("緑の箱へ移動してください。一度通った箱には戻れません。");return;}
    game.catPos=i; game.catHistory.set(i,game.turn); game.catVisible=false; game.phase="dogs";
    game.selectedDog=null; game.dogMode=null; game.dogAction=[false,false,false];
    showPrivacy("🐕","柴犬警察の番","ネコの移動が終わりました。現在地は秘密です。");
    setMsg("🐕 柴犬を1匹タップして、「移動」か「探索」を選ぼう。"); render(); return;
  }

  if(game.phase==="dogs"&&game.selectedDog!==null&&game.dogMode==="search"){
    const di=game.selectedDog;
    if(!boxesAroundNode(game.dogs[di]).includes(i)){setMsg("青く光っている箱から1つ選んでください。");return;}
    search(di,i);
  }
}

function nodePress(i){
  if(game.gameOver)return;

  if(game.phase==="dogSetup"){
    if(game.dogs.includes(i)){setMsg("その交差点にはすでに柴犬がいます。");return;}
    const di=game.dogSetupCount; game.dogs[di]=i; game.dogSetupCount++;
    if(game.dogSetupCount>=3){
      game.phase="cat";
      showPrivacy("🐱","ターン1・ネコの番","柴犬3匹の配置が完了しました。ネコさんだけ画面を見てください。");
      setMsg("🐱 「ネコ位置を見る」を押して、隣の箱へ移動しよう。");
    } else setMsg(`🐕${di+1}を配置しました。次の柴犬を配置してください。`);
    render(); return;
  }

  if(game.phase!=="dogs")return;

  const tapped=game.dogs.findIndex(p=>p===i);
  if(tapped!==-1){
    if(game.dogAction[tapped]){setMsg(`🐕${tapped+1}はこのターン行動済みです。`);return;}
    game.selectedDog=(game.selectedDog===tapped?null:tapped); game.dogMode=null;
    setMsg(game.selectedDog===null?"柴犬の選択を解除しました。":`🐕${tapped+1}を選択。「移動」か「探索」を選ぼう。`);
    render(); return;
  }

  if(game.selectedDog!==null&&game.dogMode==="move"){
    const di=game.selectedDog;
    if(!dogMoves(di).includes(i)){setMsg("緑の交差点へ1マス移動できます。");return;}
    game.dogs[di]=i; game.dogAction[di]="move"; game.selectedDog=null; game.dogMode=null;
    setMsg(`🐕${di+1}は移動済み✓。このターンは探索できません。`);
    afterDogAction(); render();
  }
}

function chooseMove(){
  if(game.phase!=="dogs"||game.selectedDog===null)return;
  game.dogMode="move"; setMsg(`🐕${game.selectedDog+1}は移動を選択。緑の交差点をタップ。`); render();
}
function chooseSearch(){
  if(game.phase!=="dogs"||game.selectedDog===null)return;
  game.dogMode="search"; setMsg(`🐕${game.selectedDog+1}は探索を選択。青く光る箱から1つタップ。`); render();
}

function search(di,bi){
  if(bi===game.catPos){shakeSoon(bi);endGame("dogs",`🐕${di+1}が箱${bi+1}でネコを発見！`);return;}

  if(game.catHistory.has(bi)){
    const t=game.catHistory.get(bi), fresh=!game.revealed.has(bi);
    game.revealed.set(bi,t);
    if(t===0){showToast("🚩","スタート地点を発見！","ここから逃げ始めたみたいだワン！");if(fresh)addDiscovery("🚩",bi);}
    else if(t===6){showToast("🐾6","決定的な証拠！","6ターン目にここを通ったワン！");if(fresh)addDiscovery("🐾6",bi);}
    else{showToast("🐕🐾","クンクン……！","ネコの痕跡を発見！");if(fresh)addDiscovery("🐾",bi);}
    shakeSoon(bi);
  } else showToast("💨","クンクン……","何もないワン！");

  game.dogAction[di]="search"; game.selectedDog=null; game.dogMode=null;
  afterDogAction(); render();
}

function afterDogAction(){
  if(!game.dogAction.every(Boolean))return;
  game.phase="waitingEnd";
  if(catMoves().length===0){endGame("dogs","ネコの逃げ道がなくなりました。完全包囲だワン！");return;}
  setMsg("✅ 3匹の行動が完了。「柴犬ターン終了」を押してください。");
}

function toggleCat(){
  if(game.phase!=="cat"||game.gameOver)return;
  game.catVisible=!game.catVisible;
  setMsg(game.catVisible?"🐱 ピンクが現在地、緑が移動できる箱です。":"🙈 ネコ位置を隠しました。");
  render();
}

function finishDogTurn(){
  if(game.phase!=="waitingEnd"||game.gameOver)return;
  if(game.turn>=MAX){endGame("cat","15ターン逃げ切り成功！");return;}
  game.turn++;
  if(catMoves().length===0){endGame("dogs","ネコが移動できる箱がありません。");return;}
  game.phase="cat"; game.catVisible=false; game.selectedDog=null; game.dogMode=null; game.dogAction=[false,false,false];
  showPrivacy("🐱",`ターン${game.turn}・ネコの番`,"柴犬警察から画面を受け取ってください。ネコさんだけ現在位置を確認します。");
  setMsg(`🐱 ターン${game.turn}。まだ通っていない隣の箱へ移動しよう。`); render();
}

function renderStatus(){
  turnDisplay.textContent=`${game.turn} / ${MAX}`;
  turnCard.classList.toggle("danger",game.turn>=12&&!game.gameOver);
  const p={catSetup:"🐱 ネコ初期配置",dogSetup:"🐕 柴犬初期配置",cat:"🐱 ネコ移動",dogs:"🐕 柴犬行動",waitingEnd:"🌙 行動完了",gameover:"🎉 ゲーム終了"};
  phaseDisplay.textContent=p[game.phase]||"";
  if(game.phase==="catSetup")guideDisplay.textContent="ネコのスタート箱を1つ選ぼう";
  else if(game.phase==="dogSetup")guideDisplay.textContent=`柴犬の交差点を選ぶ ${game.dogSetupCount}/3`;
  else if(game.phase==="cat")guideDisplay.textContent=game.catVisible?"緑の箱へ1マス移動":"「ネコ位置を見る」を押す";
  else if(game.phase==="dogs")guideDisplay.textContent=game.selectedDog===null?"未行動の柴犬をタップ":game.dogMode===null?"「移動」か「探索」を選択":game.dogMode==="move"?"緑の交差点へ移動":"青い箱を1つ探索";
  else if(game.phase==="waitingEnd")guideDisplay.textContent="柴犬ターン終了を押す";
  else guideDisplay.textContent="ゲーム終了";
}

function renderDogs(){
  for(let i=0;i<3;i++){
    const c=dogCards[i]; c.className="dog-card";
    if(game.dogs[i]===null){c.innerHTML=`🐕${i+1}<br>未配置`;continue;}
    const a=game.dogAction[i];
    if(a==="move"){c.innerHTML=`🐕${i+1}<br>移動済み ✓`;c.classList.add("done");}
    else if(a==="search"){c.innerHTML=`🐕${i+1}<br>探索済み ✓`;c.classList.add("done");}
    else c.innerHTML=`🐕${i+1}<br>交差点 ${nodeRow(game.dogs[i])+1}-${nodeCol(game.dogs[i])+1}`;
    if(game.selectedDog===i)c.classList.add("selected");
  }
}

function renderAction(){
  if(game.phase==="dogs"&&game.selectedDog!==null&&!game.dogAction[game.selectedDog]){
    actionPanel.classList.add("show"); actionTitle.textContent=`🐕${game.selectedDog+1} はどうする？`;
  } else actionPanel.classList.remove("show");
}

function addDiscovery(icon,bi){game.discoveries.unshift({icon,box:bi+1});if(game.discoveries.length>6)game.discoveries.length=6;}
function renderLog(){
  logItems.innerHTML="";
  if(!game.discoveries.length){logItems.innerHTML='<span style="font-size:9px;opacity:.65">まだ痕跡はありません</span>';return;}
  game.discoveries.forEach(d=>{const s=document.createElement("span");s.className="chip";s.textContent=`${d.icon} 箱${d.box}`;logItems.appendChild(s);});
}
function renderControls(){catViewBtn.disabled=game.phase!=="cat"||game.gameOver;finishBtn.disabled=game.phase!=="waitingEnd"||game.gameOver;catViewBtn.textContent=game.catVisible?"🙈 ネコ位置を隠す":"👀 ネコ位置を見る";}
function setMsg(t){message.textContent=t;}

function showPrivacy(icon,title,text){privacyIcon.textContent=icon;privacyTitle.textContent=title;privacyText.textContent=text;privacyOverlay.classList.add("show");}
function showToast(icon,title,text){clearTimeout(toastTimer);toastIcon.textContent=icon;toastTitle.textContent=title;toastText.textContent=text;toast.classList.add("show");toastTimer=setTimeout(()=>toast.classList.remove("show"),1500);}
function shakeSoon(i){setTimeout(()=>{const e=board.querySelector(`[data-box-index="${i}"]`);if(!e)return;e.classList.add("shake");setTimeout(()=>e.classList.remove("shake"),600)},40);}

function endGame(winner,reason){
  game.gameOver=true;game.phase="gameover";game.catVisible=true;
  if(winner==="dogs"){resultIcon.textContent="🐕🐕🐕✨";resultTitle.textContent="柴犬警察の勝利！";}
  else{resultIcon.textContent="🐱🎀✨";resultTitle.textContent="いたずらネコの勝利！";}
  resultText.textContent=`${reason} 最後のネコ位置は箱${game.catPos+1}です。`;
  resultOverlay.classList.add("show");render();
}

bindPress(moveBtn,chooseMove);
bindPress(searchBtn,chooseSearch);
bindPress(catViewBtn,toggleCat);
bindPress(finishBtn,finishDogTurn);
bindPress(restartBtn,init);
bindPress(privacyBtn,()=>privacyOverlay.classList.remove("show"));
bindPress(againBtn,init);

init();
</script>
</body>
</html>
