<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f9efe0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>にゃんチェイス Ver1.9</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app" class="app" data-turn="cat">
    <header class="topbar">
      <div class="brand" aria-label="にゃんチェイス">
        <div class="brand__paw">🐾</div>
        <div>
          <h1 class="brand__title">にゃんチェイス</h1>
          <p class="brand__version">Ver1.9 · Phase1</p>
        </div>
      </div>

      <div class="topbar__actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="BGM">
          <span id="soundIcon">🔊</span>
        </button>
        <button class="icon-button" id="settingsButton" type="button" aria-label="設定">
          ⚙️
        </button>
      </div>
    </header>

    <main class="game-shell">
      <section class="turn-card" aria-live="polite">
        <div class="turn-card__character" id="turnCharacter" aria-hidden="true">🐱</div>
        <div class="turn-card__copy">
          <div class="turn-card__eyebrow">TURN <span id="turnNumber">1</span></div>
          <div class="turn-card__title" id="turnTitle">ネコのターン</div>
          <div class="turn-card__hint" id="turnHint">見つからないように移動しよう！</div>
        </div>
        <div class="turn-card__badge" id="turnBadge">ESCAPE</div>
      </section>

      <section class="status-strip" aria-label="ゲーム状況">
        <div class="status-chip">
          <span class="status-chip__icon">🐱</span>
          <span>ネコ</span>
          <strong id="catStatus">SAFE</strong>
        </div>
        <div class="status-chip">
          <span class="status-chip__icon">🐕</span>
          <span>柴犬</span>
          <strong>3匹</strong>
        </div>
        <div class="status-chip">
          <span class="status-chip__icon">🎯</span>
          <span>残り</span>
          <strong id="remainingTurns">12</strong>
        </div>
      </section>

      <section class="board-frame" aria-label="ゲーム盤面">
        <div class="board-frame__top">
          <span class="board-label">BOX MAZE</span>
          <span class="board-message" id="boardMessage">逃げ道を選んでね</span>
        </div>

        <div id="gameBoard" class="game-board" role="grid" aria-label="にゃんチェイス盤面"></div>

        <div class="legend">
          <span><i class="legend__dot legend__dot--cat"></i>ネコ</span>
          <span><i class="legend__dot legend__dot--dog"></i>柴犬</span>
          <span><i class="legend__dot legend__dot--box"></i>箱</span>
        </div>
      </section>

      <section class="action-panel">
        <div class="action-panel__message" id="actionMessage">
          <span class="action-panel__icon">🐾</span>
          <div>
            <small>つぎの行動</small>
            <strong id="actionTitle">移動先をタップ</strong>
          </div>
        </div>

        <div class="action-grid" id="catActions">
          <button class="action-button action-button--primary" type="button" data-demo-action="move">
            <span>🐾</span>
            <strong>移動</strong>
            <small>逃げ道を選ぶ</small>
          </button>
          <button class="action-button" type="button" data-demo-action="hide">
            <span>📦</span>
            <strong>かくれる</strong>
            <small>箱を利用する</small>
          </button>
        </div>

        <div class="action-grid action-grid--dog" id="dogActions" hidden>
          <button class="action-button action-button--dog-primary" type="button" data-demo-action="search">
            <span>👃</span>
            <strong>探索</strong>
            <small>クンクン調べる</small>
          </button>
          <button class="action-button" type="button" data-demo-action="move">
            <span>🐕</span>
            <strong>移動</strong>
            <small>交差点を選ぶ</small>
          </button>
        </div>
      </section>

      <nav class="utility-bar" aria-label="ゲーム操作">
        <button type="button" data-utility="hint"><span>💡</span><small>ヒント</small></button>
        <button type="button" data-utility="turn"><span>🔄</span><small>ターン切替</small></button>
        <button type="button" data-utility="restart"><span>↻</span><small>やり直す</small></button>
      </nav>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="settings-sheet" id="settingsDialog">
      <form method="dialog" class="settings-sheet__inner">
        <div class="sheet-handle"></div>
        <div class="settings-sheet__header">
          <div>
            <small>GAME SETTINGS</small>
            <h2>設定</h2>
          </div>
          <button class="icon-button icon-button--small" value="close" aria-label="閉じる">✕</button>
        </div>

        <label class="setting-row">
          <span>
            <strong>BGM</strong>
            <small>ゲーム中の音楽</small>
          </span>
          <input id="bgmToggle" type="checkbox" checked>
        </label>

        <label class="volume-row">
          <span>BGM音量</span>
          <output id="volumeValue">70%</output>
          <input id="bgmVolume" type="range" min="0" max="100" value="70">
        </label>

        <label class="setting-row">
          <span>
            <strong>効果音</strong>
            <small>タップ・発見演出など</small>
          </span>
          <input id="seToggle" type="checkbox" checked>
        </label>

        <p class="settings-note">Phase1ではUIのみ。音源接続は後続Phaseで行います。</p>
      </form>
    </dialog>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
